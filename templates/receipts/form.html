{% extends "base.html" %}
{% block title %}新建称重回执{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>新建称重回执</h1>
    <p>仅可对本轮「已出灰」的熟化池交单；同一池本轮有一张未作废回执后不能再交。</p>
  </div>
</header>
<form class="panel" method="post">
  <label>熟化池
    <select name="pond_id" required>
      <option value="" disabled selected>请选择已出灰的熟化池</option>
      {% for pond in ponds %}
      <option value="{{ pond.id }}" {% if preselect_pond_id == pond.id %}selected{% endif %}>{{ pond.code }}（{{ pond.plant.name }}）</option>
      {% endfor %}
    </select>
  </label>
  <label>净重（吨）
    <input name="net_weight_t" type="number" step="0.01" min="0.01" required placeholder="例如 32.5" />
  </label>
  <label>过磅时刻
    <input name="weighed_at" type="datetime-local" step="60" required />
  </label>
  <label>司磅人
    <input name="weigher" value="{{ weigher_default }}" required maxlength="64" />
  </label>
  <div class="actions">
    <button type="submit">提交回执</button>
    <a class="btn ghost" href="{{ url_for('receipts.list_receipts') }}">返回列表</a>
  </div>
</form>
{% endblock %}
